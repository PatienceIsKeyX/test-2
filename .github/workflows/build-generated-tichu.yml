name: Build generated Tichu APK
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Reconstruct source
        run: |
          cat tichu_payload/part*.b64 | base64 -d > /tmp/tichu.zip
          mkdir -p tichu
          unzip -q /tmp/tichu.zip -d tichu
          unzip -t /tmp/tichu.zip
      - name: Apply final source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("tichu/app/src/main/java/com/oai/tichulan/MainActivity.java")
          s=p.read_text()
          s=s.replace(
              'if(game.closing && tok==closeToken){ game.finishClosingTrick(); broadcast(); }',
              'if(game.closing && tok==closeToken){ try{ game.finishClosingTrick(); broadcast(); }catch(RuleException ignored){} }'
          )
          s=s.replace(
              'if(ids.contains(TichuRules.MAHJONG)){req(wishChoice>=2&&wishChoice<=14,"Choose a Mahjong wish from 2 through Ace");}',
              'if(ids.contains(TichuRules.MAHJONG)){req(wishChoice==0||(wishChoice>=2&&wishChoice<=14),"Mahjong wish must be no wish or a rank from 2 through Ace");}'
          )
          s=s.replace('int wishChoice=2;', 'int wishChoice=0;')
          s=s.replace(
              'labels.add("WISH "+Engine.rankName(wishChoice));acts.add("WISH");args.add(0);',
              'labels.add(wishChoice==0?"NO WISH":"WISH "+Engine.rankName(wishChoice));acts.add("WISH");args.add(0);'
          )
          s=s.replace(
              'if("WISH".equals(b.action)){wishChoice++;if(wishChoice>14)wishChoice=2;invalidate();return;}',
              'if("WISH".equals(b.action)){if(wishChoice==0)wishChoice=2;else if(wishChoice>=14)wishChoice=0;else wishChoice++;invalidate();return;}'
          )
          p.write_text(s)

          p=Path("tichu/app/src/main/java/com/oai/tichulan/TichuRules.java")
          s=p.read_text()
          import re
          if 'if (start == 1 && !fixed.contains(1)) continue;' not in s:
              s,n=re.subn(
                  r'(for \\(int start=1; start\\+n-1<=14; start\\+\\+\\) \\{\\s*)(boolean ok = true;)',
                  r'\\1// Phoenix may stand for an ordinary 2-Ace, never the Mahjong rank 1.\\n            if (start == 1 && !fixed.contains(1)) continue;\\n            \\2',
                  s,count=1
              )
              if n != 1:
                  raise SystemExit("Phoenix straight patch target missing")
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: tichu
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee ../tichu-build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tichu-build-log
          path: tichu-build.log
          if-no-files-found: warn
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TichuLAN-apk
          path: tichu/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
