name: Export Android Build Tools

on:
  push:
    branches: [ firesand-toolchain ]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Install Android SDK pieces
        shell: bash
        run: |
          SDK=/usr/local/lib/android/sdk
          MANAGER="$SDK/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$MANAGER"
          yes | "$MANAGER" --licenses >/dev/null 2>&1 || true
          "$MANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Package tools
        shell: bash
        run: |
          set -eux
          SDK=/usr/local/lib/android/sdk
          mkdir -p export/platforms export/build-tools
          cp -a "$SDK/platforms/android-36" export/platforms/
          cp -a "$SDK/build-tools/36.0.0" export/build-tools/
          tar -C export -czf android-tools-36.tar.gz .
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: android-tools-36
          path: android-tools-36.tar.gz
          retention-days: 1
