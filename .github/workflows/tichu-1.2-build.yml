name: Build Tichu 1.2 APK
on:
  push:
    branches:
      - tichu-ui-1.2-20261001
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified source
        shell: bash
        run: |
          cat tichu12_payload/part00_0.b64 tichu12_payload/part00_1.b64 tichu12_payload/part00_2.b64 tichu12_payload/part00_3a.b64 tichu12_payload/part00_3b0a.b64 tichu12_payload/part00_3b0b.b64 tichu12_payload/part00_3b1.b64 tichu12_payload/part01.b64 tichu12_payload/part02.b64 tichu12_payload/part03.b64 | tr -d '\n\r' | base64 -d > /tmp/Tichu-1.2-source.zip
          echo "f338bd3f3c981e9f67e81273f3d38b1062de4c97a536c0eb094535ccafef9183  /tmp/Tichu-1.2-source.zip" | sha256sum -c -
          rm -rf /tmp/tichu12
          mkdir -p /tmp/tichu12
          unzip -q /tmp/Tichu-1.2-source.zip -d /tmp/tichu12

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: /tmp/tichu12
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -f /tmp/tichu12/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose /tmp/tichu12/app/build/outputs/apk/debug/app-debug.apk
          sha256sum /tmp/tichu12/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tichu-1.2-apk
          path: /tmp/tichu12/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
